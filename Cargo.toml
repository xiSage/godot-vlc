[package]
name = "godot-vlc"
version = "1.2.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = {version = "0.5", features = ["experimental-threads", "register-docs", "api-4-3"]}
printf = "0.1"
ringbuf = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Used to set VLC_LIB_PATH before libvlc_new. libc::setenv is called rather than
# std::env::set_var because mutating the environment through Rust's API is
# unsafe, and LibVLC reads the environment through the C library regardless.
libc = "0.2"

[features]
default = ["gpu"]
gpu = ["dep:windows"]

[build-dependencies]
bindgen = "0.72"
