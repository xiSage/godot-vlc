[package]
name = "godot-vlc"
version = "1.2.0"
edition = "2024"
# The oldest compiler this crate builds with. Derived rather than guessed: the
# highest requirement in the source is slice::as_chunks, stable since 1.88.0
# (read from the standard library's own rustdoc), and that is above the 1.85.0
# that edition 2024 needs. It is deliberately lower than what rust-toolchain.toml
# pins, which is the compiler CI and contributors actually use.
rust-version = "1.88"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = {version = "0.5", features = ["experimental-threads", "register-docs", "api-4-3"]}
printf = "0.1"
ringbuf = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
# Used to set HOME before libvlc_new. LibVLC's Android platform layer derives its
# user data, cache and config directories from $HOME, and falls back to a
# hardcoded /sdcard/Android/data/org.videolan.vlc when it is unset -- another
# application's directory, which this process is not allowed to write. libc is
# used for the same reason as on Linux: LibVLC reads the environment through the
# C library, and mutating it through Rust's own API is unsafe.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Used to set VLC_LIB_PATH before libvlc_new. libc::setenv is called rather than
# std::env::set_var because mutating the environment through Rust's API is
# unsafe, and LibVLC reads the environment through the C library regardless.
libc = "0.2"

[features]
default = ["gpu"]
gpu = ["dep:windows"]

[build-dependencies]
bindgen = "0.72"
