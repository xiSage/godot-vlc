name: build

defaults:
  run:
    shell: pwsh

on:
  push:
    # build_workflow is listed so that this branch is actually validated; drop it
    # once the branch is merged.
    branches: [ "master", "build_workflow" ]
  pull_request:
    branches: [ "master" ]
  # So the pipeline can be re-run from the Actions tab without adding a commit.
  # These jobs take long enough that a transient failure is worth retrying
  # without rewriting history.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast checks on the checking logic itself. No runtime, no container, no
  # network, so a broken gate is reported before anything expensive starts.
  script_tests:
    name: script self-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: RUNPATH checker
      run: ./build/vlc/check-runpath.ps1 -SelfTest

    - name: Addon checks
      run: ./scripts/check_addon.ps1 -SelfTest

    - name: glibc floor check
      run: ./scripts/check_glibc_floor.ps1 -SelfTest

    - name: LibVLC provenance check
      run: ./scripts/check_vlc_provenance.ps1 -SelfTest

  # Formatting only. Clippy needs the crate to compile, and the crate's build
  # script generates its LibVLC bindings from the staged runtime's vlc.h, so
  # clippy lives in the platform jobs where that runtime has been staged. It runs
  # on both platforms on purpose: the crate has Linux-only and Windows-only code
  # under #[cfg], and linting on one platform never sees the other's.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Rustfmt Check
      run: cargo fmt --all -- --check

  # Both LibVLC artifacts are produced on Linux. The Windows runtime is a
  # mingw-w64 cross build from the same container and the same pinned commit:
  # GitHub's Windows runners have no Docker daemon, and building the two
  # platforms from two different VLC revisions made any cross-platform behaviour
  # difference impossible to attribute.
  #
  # The artifact is cached on the hash of the build inputs, so bumping
  # build/vlc/vlc.lock rebuilds it while an unchanged pin does not pay the one
  # to two hour contrib build on every run.
  build_vlc_linux64:
    name: LibVLC (linux-x64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Restore the LibVLC artifact
      id: cache
      uses: actions/cache@v6
      with:
        path: artifacts
        key: vlc-linux-x64-${{ hashFiles('build/vlc/vlc.lock', 'build/vlc/Dockerfile', 'build/vlc/*.ps1', 'build/vlc/lib/*.ps1', 'build/vlc/patches/*') }}

    - name: Build the pinned build environment
      if: steps.cache.outputs.cache-hit != 'true'
      run: docker build -t godot-vlc/vlc-build build/vlc

    - name: Build LibVLC
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        New-Item -Path artifacts -ItemType Directory -Force | Out-Null
        docker run --rm -v "$($PWD.Path)/artifacts:/out" godot-vlc/vlc-build linux-x64 /out

    - uses: actions/upload-artifact@v7
      with:
        name: vlc-linux-x64
        path: artifacts/vlc-linux-x64.tar.gz

  build_vlc_win64:
    name: LibVLC (win-x64, mingw cross)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Restore the LibVLC artifact
      id: cache
      uses: actions/cache@v6
      with:
        path: artifacts
        key: vlc-win-x64-${{ hashFiles('build/vlc/vlc.lock', 'build/vlc/Dockerfile', 'build/vlc/*.ps1', 'build/vlc/lib/*.ps1', 'build/vlc/patches/*') }}

    - name: Build the pinned build environment
      if: steps.cache.outputs.cache-hit != 'true'
      # The Windows runtime is cross-compiled from a newer base than the Linux
      # one, because its mingw-w64 decides only what cross-compiles and nothing
      # about the artifact's glibc floor: a Windows runtime is PE. mingw-w64 9 on
      # 22.04 is gcc 10, and packages such as ggml, glslang and libaribcaption do
      # not compile against it. The default base stays 22.04 so that the Linux
      # runtime's glibc matches the extension's own baseline.
      run: docker build --build-arg BASE_IMAGE=ubuntu:24.04 -t godot-vlc/vlc-build-win build/vlc

    - name: Build LibVLC
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        New-Item -Path artifacts -ItemType Directory -Force | Out-Null
        docker run --rm -v "$($PWD.Path)/artifacts:/out" godot-vlc/vlc-build-win win-x64 /out

    - uses: actions/upload-artifact@v7
      with:
        name: vlc-win-x64
        path: artifacts/vlc-win-x64.tar.gz

  # The Android runtime comes from a different build system from the two desktop
  # ones: VLC's own Android build system, driving the NDK into a single
  # monolithic libvlc.so. It is a job of its own rather than a matrix entry, and
  # the container supplies the toolchain exactly as it does for the desktop
  # runtimes -- which is also why it is Linux-only.
  #
  # Cached on the same inputs as the desktop artifacts, plus the revision of the
  # Android build system, so an unchanged pin does not pay for the contrib build
  # again.
  build_vlc_android_arm64:
    name: LibVLC (android-arm64)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - name: Restore the LibVLC artifact
      id: cache
      uses: actions/cache@v6
      with:
        path: artifacts
        key: vlc-android-arm64-${{ hashFiles('build/vlc/vlc.lock', 'build/vlc-android/Dockerfile', 'build/vlc-android/build.sh') }}

    - name: Build the pinned build environment
      if: steps.cache.outputs.cache-hit != 'true'
      run: docker build -f build/vlc-android/Dockerfile -t godot-vlc/vlc-android-build build

    - name: Build LibVLC
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        New-Item -Path artifacts -ItemType Directory -Force | Out-Null
        docker run --rm -v "$($PWD.Path)/artifacts:/out" godot-vlc/vlc-android-build arm64-v8a /out

    - uses: actions/upload-artifact@v7
      with:
        name: vlc-android-arm64
        path: artifacts/vlc-android-arm64.tar.gz

  build_linux64:
    needs: [ build_vlc_linux64 ]
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    # Keep this in step with the actions/upload-artifact version used above.
    - uses: actions/download-artifact@v8
      with:
        name: vlc-linux-x64
        path: artifacts

    - name: Stage the LibVLC runtime
      run: ./scripts/stage_libvlc.ps1 -Platforms linux-x64 -IncludeTools

    # The addon expects the X11 stack, which scripts/host-provided-libs.txt
    # justifies on the grounds that the official Godot Linux binary needs it too.
    # A headless runner has none of it, so one plugin cannot be loaded and the
    # acceptance test fails for a reason that has nothing to do with the runtime.
    # Installing the documented host libraries is what makes the runner the host
    # the manifest assumes; every one of them is present on any machine that can
    # open a windowed Godot, which is the machine this addon is for.
    - name: Install the documented host libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends `
          libxkbcommon-x11-0 libxkbcommon0 libx11-6 libxcb1 libxau6 libxdmcp6 libbsd0 libmd0

    # After staging, because the build script generates its bindings from the
    # staged runtime's vlc.h. Here rather than in the lint job for that reason,
    # and here as well as on Windows because the crate's #[cfg] code differs.
    - name: Clippy Check
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Test
      run: ./scripts/test.ps1

    - name: Build Debug
      run: ./scripts/build_debug.ps1

    - name: Build Release
      run: ./scripts/build_release.ps1

    - name: Assemble the addon
      run: ./scripts/assemble_addon.ps1 -Platforms linux-x64

    - name: Check the addon is complete and self-contained
      run: ./scripts/check_addon.ps1 -Platforms linux-x64

    - name: Bound the glibc requirement of the extension and the runtime
      run: ./scripts/check_glibc_floor.ps1 -Path target/release/libgodot_vlc.so, gdextension_template/bin/linux-x64

    - name: Acceptance test (decode a real H.264 file from the assembled addon)
      run: ./scripts/acceptance_test.ps1 -Platform linux-x64

    - name: Copy Binary
      run: |
        New-Item -Path "bin/" -ItemType Directory -Force | Out-Null
        Copy-Item -Path "target/debug/libgodot_vlc.so" -Destination "bin/libgodot_vlc_debug.so"
        Copy-Item -Path "target/release/libgodot_vlc.so" -Destination "bin/libgodot_vlc.so"

    - uses: actions/upload-artifact@v7
      with:
        name: linux64
        path: bin/*

  build_win64:
    needs: [ build_vlc_win64 ]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install LLVM and Clang # required for bindgen to work, see https://github.com/rust-lang/rust-bindgen/issues/1797
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21"
        directory: ${{ runner.temp }}/llvm

    - name: Set LIBCLANG_PATH
      run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV

    # Keep this in step with the actions/upload-artifact version used above.
    - uses: actions/download-artifact@v8
      with:
        name: vlc-win-x64
        path: artifacts

    - name: Stage the LibVLC runtime
      run: ./scripts/stage_libvlc.ps1 -Platforms win-x64 -IncludeTools

    # The same check as on Linux, and not redundant with it: the crate has
    # Windows-only code under #[cfg] that a Linux clippy run never compiles.
    - name: Clippy Check
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build Debug
      run: ./scripts/build_debug.ps1

    - name: Build Release
      run: ./scripts/build_release.ps1

    - name: Assemble the addon
      run: ./scripts/assemble_addon.ps1 -Platforms win-x64

    - name: Check the addon is complete and self-contained
      run: ./scripts/check_addon.ps1 -Platforms win-x64

    - name: Acceptance test (decode a real H.264 file from the assembled addon)
      run: ./scripts/acceptance_test.ps1 -Platform win-x64

    - name: Copy Binary
      run: |
        New-Item -Path "bin/" -ItemType Directory -Force | Out-Null
        Copy-Item -Path "target/debug/godot_vlc.dll" -Destination "bin/godot_vlc_debug.dll"
        Copy-Item -Path "target/debug/godot_vlc.pdb" -Destination "bin/godot_vlc_debug.pdb"
        Copy-Item -Path "target/release/godot_vlc.dll" -Destination "bin/godot_vlc.dll"

    - uses: actions/upload-artifact@v7
      with:
        name: win64
        path: bin/*

  # The extension for Android, which no other job compiles. Its #[cfg] code is
  # built nowhere else, so this is also the only place clippy sees it -- the same
  # reason the Linux and Windows jobs lint separately rather than once.
  #
  # The device check (scripts/acceptance_test_android.ps1) cannot run here: it
  # needs the device. What CI can do is everything up to it -- build the extension
  # with the NDK, assemble the addon, and put it through the gate.
  #
  # Nothing consumes this artifact yet, and that is deliberate: the package job
  # assembles the addon for every platform the release supports, and Android joins
  # it there.
  build_android64:
    needs: [ build_vlc_android_arm64 ]
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: vlc-android-arm64
        path: artifacts

    - name: Stage the LibVLC runtime
      run: ./scripts/stage_libvlc.ps1 -Platforms android-arm64

    # The NDK is fetched rather than installed through sdkmanager: the extension is
    # built with r28, the revision build/vlc-android pins too, and one cached
    # download beats populating a cmdline-tools SDK to install the same thing.
    - name: Restore the Android NDK
      id: ndk
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/android-ndk-r28b
        key: android-ndk-r28b-linux

    - name: Fetch the Android NDK
      if: steps.ndk.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o "$env:RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
        unzip -q "$env:RUNNER_TEMP/ndk.zip" -d "$env:RUNNER_TEMP"

    # The NDK's own bin goes on PATH as well, so that the gate reads DT_NEEDED with
    # the same toolchain that produced the library.
    - name: Point the build at the NDK
      run: |
        $ndk = "$env:RUNNER_TEMP/android-ndk-r28b"
        $toolchain = "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
        "ANDROID_NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang" | Out-File -FilePath $env:GITHUB_ENV -Append
        "AR_aarch64_linux_android=$toolchain/llvm-ar" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android24-clang" | Out-File -FilePath $env:GITHUB_ENV -Append
        $toolchain | Out-File -FilePath $env:GITHUB_PATH -Append

    # Run from the repository, so that rustup resolves the pin in
    # rust-toolchain.toml and the target is added to the toolchain CI actually
    # builds and lints with.
    - name: Add the Android target to the pinned toolchain
      run: rustup target add aarch64-linux-android

    # After staging, like the other two: the build script generates its bindings
    # from the staged runtime's vlc.h.
    - name: Clippy Check (the Android target)
      run: cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings

    # No Test step. The crate's tests drive the runtime on the host, and the
    # extension cannot be executed here at all; the device is what runs it.
    - name: Build Debug
      run: cargo build --target aarch64-linux-android

    - name: Build Release
      run: cargo build --release --target aarch64-linux-android

    - name: Assemble the addon
      run: ./scripts/assemble_addon.ps1 -Platforms android-arm64

    - name: Check the addon is complete and self-contained
      run: ./scripts/check_addon.ps1 -Platforms android-arm64

    # Android 15 and later refuse a native library whose segments are not 16 KB
    # aligned. The NDK's linker produces that today, and this is what would notice
    # if a later revision stopped.
    - name: Check the extension is 16 KB aligned
      run: |
        $library = 'target/aarch64-linux-android/release/libgodot_vlc.so'
        if (-not (Test-Path -LiteralPath $library)) { throw "$library is missing; the release build did not produce it" }
        $alignment = llvm-readelf -l $library |
          Select-String ' LOAD ' | ForEach-Object { ($_.Line -split '\s+')[-1] } | Sort-Object -Unique
        if ($alignment -ne '0x4000') { throw "LOAD alignment is '$alignment', expected 0x4000 (16 KB)" }
        Write-Host 'the extension is 16 KB aligned'

    - name: Copy Binary
      run: |
        New-Item -Path "bin/" -ItemType Directory -Force | Out-Null
        Copy-Item -Path "target/aarch64-linux-android/debug/libgodot_vlc.so" -Destination "bin/libgodot_vlc_debug.so"
        Copy-Item -Path "target/aarch64-linux-android/release/libgodot_vlc.so" -Destination "bin/libgodot_vlc.so"

    - uses: actions/upload-artifact@v7
      with:
        name: android64
        path: bin/*

  # The distributable addon contains all three platforms, so it can only be
  # assembled where all three are present. This job is also the only place the
  # required cross-platform gate can run: asserting that the artifacts share a
  # commit and an ABI needs all of them in hand.
  package:
    needs: [ build_vlc_linux64, build_vlc_win64, build_vlc_android_arm64, build_linux64, build_win64, build_android64 ]
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: vlc-linux-x64
        path: artifacts

    - uses: actions/download-artifact@v8
      with:
        name: vlc-win-x64
        path: artifacts

    - uses: actions/download-artifact@v8
      with:
        name: vlc-android-arm64
        path: artifacts

    - name: Assert every runtime shares a commit and an ABI
      run: ./scripts/check_vlc_provenance.ps1 -Platforms win-x64,linux-x64,android-arm64

    - uses: actions/download-artifact@v8
      with:
        name: linux64
        path: bin/linux

    - uses: actions/download-artifact@v8
      with:
        name: win64
        path: bin/win

    - uses: actions/download-artifact@v8
      with:
        name: android64
        path: bin/android

    # Put the downloaded binaries where the build would have left them, so that
    # the assembler and the packaging step see the usual layout. The Android
    # extension is a cross build, so it lands under the target triple rather than
    # beside the two host builds.
    - name: Restore the build output layout
      run: |
        New-Item -Path target/release, target/debug -ItemType Directory -Force | Out-Null
        New-Item -Path target/aarch64-linux-android/release, target/aarch64-linux-android/debug -ItemType Directory -Force | Out-Null
        Copy-Item bin/linux/libgodot_vlc.so        target/release/libgodot_vlc.so
        Copy-Item bin/linux/libgodot_vlc_debug.so  target/debug/libgodot_vlc.so
        Copy-Item bin/win/godot_vlc.dll            target/release/godot_vlc.dll
        Copy-Item bin/win/godot_vlc_debug.dll      target/debug/godot_vlc.dll
        Copy-Item bin/android/libgodot_vlc.so       target/aarch64-linux-android/release/libgodot_vlc.so
        Copy-Item bin/android/libgodot_vlc_debug.so target/aarch64-linux-android/debug/libgodot_vlc.so

    - name: Stage every LibVLC runtime
      run: ./scripts/stage_libvlc.ps1 -Platforms win-x64,linux-x64,android-arm64

    - name: Assemble, verify and package the addon
      run: ./scripts/publish.ps1 -SkipBuild -Platforms win-x64,linux-x64,android-arm64

    - uses: actions/upload-artifact@v7
      with:
        name: godot-vlc-addon
        path: "*.zip"
